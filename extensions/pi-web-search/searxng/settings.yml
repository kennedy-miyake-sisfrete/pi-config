# SearXNG settings — customized for pi-web-search
# See https://docs.searxng.org/admin/settings/settings.yml
use_default_settings: true
general:
  instance_name: "pi-web-search"
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
server:
  secret_key: "ultrasecretkey"  # overridden by SEARXNG_SECRET env var
  limiter: false
  image_proxy: false
  method: "GET"
ui:
  static_use_hash: true
  default_locale: ""
